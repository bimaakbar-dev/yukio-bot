name: Fix Track v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply fixes
        run: |
          python3 << 'PYEOF'
          import os, re

          # 1. Delete track-callbacks.ts
          for p in ['src/commands/track-callbacks.ts']:
              if os.path.exists(p):
                  os.remove(p)
                  print(f'OK: deleted {p}')

          # 2. Fix index.ts
          p = 'src/index.ts'
          with open(p) as f:
              content = f.read()

          content = re.sub(
              r"import \{ setupTrackCmsCallbacks \} from './commands/track-callbacks';\n",
              "",
              content
          )

          if "setupTrackCallbacks" not in content:
              if "import { handleTrackTextV2 } from './commands/track';" in content:
                  content = content.replace(
                      "import { handleTrackTextV2 } from './commands/track';",
                      "import { handleTrackTextV2, setupTrackCallbacks } from './commands/track';"
                  )
              else:
                  content = content.replace(
                      "import { COMMANDS } from './commands/list';",
                      "import { handleTrackTextV2, setupTrackCallbacks } from './commands/track';\nimport { COMMANDS } from './commands/list';"
                  )

          content = content.replace(
              "setupTrackCmsCallbacks(bot, env);",
              "setupTrackCallbacks(bot, env);"
          )

          with open(p, 'w') as f:
              f.write(content)
          print('OK: fixed index.ts')

          # 3. Fix track.ts
          p = 'src/commands/track.ts'
          with open(p) as f:
              content = f.read()

          # 3a. Convert 4-arg editMessageText to api.editMessageText
          content = re.sub(
              r'(?<!\.api)editMessageText\(',
              'api.editMessageText(',
              content
          )

          # 3b. Remove unused import
          content = re.sub(r'\s*type TrackedAnimeRow,', '', content)

          with open(p, 'w') as f:
              f.write(content)
          print('OK: fixed track.ts')
          PYEOF

      - name: Commit & push
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: track cms integration v2"
            git push
          fil